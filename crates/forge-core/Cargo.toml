[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forge 4.0 engine: roles, signed bases, libvirt overlays"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
